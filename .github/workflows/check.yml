name: Check skill and example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check skill identity and links
        run: python3 scripts/check_skill.py
      - name: Check the example state file
        run: python3 scripts/harness_state.py examples/harness/state.json --summary
      - name: Check the launch and wait script syntax
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: Run the state checker tests
        run: python3 -m unittest discover -s tests -v
